<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F5F2;
  --bg2:#FFFFFF;
  --bg3:#EFEFEC;
  --border:#E8E8E4;
  --border2:#DCDCD8;
  --text:#111111;
  --text2:#555555;
  --text3:#AAAAAA;
  --green:#1A4D1A;
  --green-mid:#2A6B2A;
  --green-light:#EDF5ED;
  --green-dim:#D4EDD4;
  --amber:#B45309;
  --amber-light:#FEF3C7;
  --coral:#9B2C2C;
  --coral-light:#FEE2E2;
  --font:'Inter',sans-serif;
  --mono:'Inter',monospace;
}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font);color:var(--text)}

.app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:430px;margin:0 auto;overflow:hidden}

/* HEADER */
.header{flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 20px 14px;padding-top:calc(16px + env(safe-area-inset-top))}
.header-greeting{font-size:12px;color:var(--text3);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px}
.header-title{font-size:28px;font-weight:900;color:var(--text);letter-spacing:-1.5px;line-height:1}
.header-row{display:flex;align-items:flex-start;justify-content:space-between}
.header-sub{font-size:12px;color:var(--text3);margin-top:3px;font-weight:400}
.header-badge{background:var(--green);color:#fff;font-size:11px;font-weight:700;padding:5px 13px;border-radius:20px;letter-spacing:0.3px;white-space:nowrap;margin-top:2px}

/* CONTENT */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;background:var(--bg)}

/* HOME — no scroll, fits exactly */
.home-wrap{display:flex;flex-direction:column;height:100%;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}

/* OTHER TABS — scroll freely */
.scroll-wrap{padding:12px 12px 20px}

/* TODAY CARD */
.today-card{background:var(--green);border-radius:20px;padding:18px 20px;flex-shrink:0;position:relative;overflow:hidden}
.today-card-glow{position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.06);pointer-events:none}
.today-label{font-size:11px;color:rgba(255,255,255,0.55);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px}
.today-session{font-size:40px;font-weight:900;color:#fff;letter-spacing:-2px;line-height:1.05}
.today-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
.today-badge{background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.25);color:#fff;font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px}
.today-sub{font-size:12px;color:rgba(255,255,255,0.55);font-weight:400;margin-bottom:10px}
.change-row{display:flex;gap:5px}

const STORE_KEY='hugo_gym_v2';
function loadData(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{}')}catch{return{}}}
function saveData(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d));showToast('Guardado ✓')}catch(e){}}
let gymData=loadData();

function weekKey(){const d=new Date(),j=new Date(d.getFullYear(),0,1);return d.getFullYear()+'-W'+Math.ceil(((d-j)/86400000+j.getDay()+1)/7);}
function todayIdx(){const d=new Date().getDay();return d===0?6:d-1;}
function getWeekPlan(wk){if(!gymData.weekPlan)gymData.weekPlan={};return gymData.weekPlan[wk]?[...gymData.weekPlan[wk]]:[...DEFAULT_PLAN];}
function getDayData(wk,di){if(!gymData[wk])gymData[wk]={};if(!gymData[wk][di])gymData[wk][di]={pasos:'',peso:'',sueno:'',entreno:'',sets:{},notas:'',sessionOverride:null,sessionSaved:false};return gymData[wk][di];}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg||'Guardado ✓';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function greeting(){const h=new Date().getHours();return h<12?'Buenos días':h<20?'Buenas tardes':'Buenas noches';}

function switchTab(tab){
  state.tab=tab;
  state.selectedDay=todayIdx();
  ['home','train','diet','cheats'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('active',x===tab));
  render();
}

function render(){
  const c=document.getElementById('main-content');
  if(state.tab==='home')c.innerHTML=renderHome();
  else if(state.tab==='train')c.innerHTML=renderTrain();
  else if(state.tab==='diet')c.innerHTML=renderDiet();
  else if(state.tab==='cheats')c.innerHTML=renderCheats();
}

function renderHome(){
  const wk=weekKey(),di=state.selectedDay,todayI=todayIdx();
  const dd=getDayData(wk,di),weekPlan=getWeekPlan(wk);
  const active=dd.sessionOverride||weekPlan[di],isTrain=SESSIONS.includes(active),isToday=di===todayI;
  document.getElementById('greeting').textContent=greeting();
  const now=new Date();
  document.getElementById('header-date').textContent=isToday
    ?DAYS[di]+', '+now.getDate()+'/'+(now.getMonth()+1)+'/'+now.getFullYear()
    :DAYS[di]+' · semana actual';
  const wd=gymData[wk]||{};
  const media=Math.round([0,1,2,3,4,5,6].map(i=>wd[i]&&wd[i].pasos?parseInt(wd[i].pasos):0).reduce((a,b)=>a+b,0)/7);
  const pesos=[0,1,2,3,4,5,6].map(i=>wd[i]&&wd[i].peso?parseFloat(wd[i].peso):null).filter(Boolean);
  const ultimoPeso=pesos.length?pesos[pesos.length-1]:null;
  const pasos=parseInt(dd.pasos)||0;
  const pasosW=Math.min(100,pasos/10000*100);

  return '<div class="home-wrap">'+
    '<div class="today-card">'+
      '<div class="today-card-glow"></div>'+
      '<div class="today-label">'+(isToday?'Plan de hoy':'Plan del día')+'</div>'+
      '<div class="today-row">'+
        '<div class="today-session">'+active+'</div>'+
        '<div class="today-badge">'+DAYS[di].substring(0,3)+'</div>'+
      '</div>'+
      '<div class="today-sub">'+(isTrain?'Sesión según tu plan semanal':'Día de descanso · Recuperación activa')+'</div>'+
      '<div class="change-row">'+
        SESSIONS.map(s=>'<div class="change-chip'+(s===active?' chip-active':'')+'" onclick="setOverrideForDay('+di+',\''+s+'\')">'+s+'</div>').join('')+
        '<div class="change-chip'+(active==='DESCANSO'&&!dd.sessionOverride?'':dd.sessionOverride==='DESCANSO'?' chip-active':'')+'" onclick="setOverrideForDay('+di+',\'DESCANSO\')">DSC</div>'+
      '</div>'+
    '</div>'+
    (dd.sessionOverride?
      '<div style="margin-top:8px">'+
        '<div style="display:flex;gap:6px;margin-bottom:6px">'+
          '<button onclick="toggleWeekReorder()" style="flex:1;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:8px;padding:7px;font-size:11px;font-weight:700;font-family:var(--font);cursor:pointer">'+
            '📅 Reorganizar semana'+
          '</button>'+
        '</div>'+
        (state.showWeekReorder?renderWeekReorder(weekKey(),weekPlan):'')+
      '</div>':'')+
    '</div>'+
    '<div class="home-gap"></div>'+
    '<div class="stat-grid">'+
      '<div class="stat-card">'+
        '<div class="stat-icon">👟</div>'+
        '<input type="number" inputmode="numeric" placeholder="0" value="'+(dd.pasos||'')+'" class="stat-val'+(dd.pasos?'':' empty')+'" style="border:none;background:transparent;width:100%;font-size:34px;font-weight:900;letter-spacing:-2px;color:var(--text);padding:0;font-family:var(--font)" onchange="saveDayField('+di+',\'pasos\',this.value)" onfocus="this.select()">'+
        '<div class="progress-bg"><div class="progress-fill" style="width:'+pasosW+'%"></div></div>'+
        '<div class="stat-lbl">Pasos</div>'+
        '<div class="stat-sub">Media: '+media.toLocaleString()+'</div>'+
      '</div>'+
      '<div class="stat-card">'+
        '<div class="stat-icon">🌙</div>'+
        '<input type="number" inputmode="decimal" step="0.5" placeholder="0" value="'+(dd.sueno||'')+'" class="stat-val'+(dd.sueno?'':' empty')+'" style="border:none;background:transparent;width:100%;font-size:34px;font-weight:900;letter-spacing:-2px;color:var(--text);padding:0;font-family:var(--font)" onchange="saveDayField('+di+',\'sueno\',this.value)" onfocus="this.select()">'+
        '<div class="stat-lbl">Sueño</div>'+
        '<div class="stat-sub">horas · rec: 7-9h</div>'+
      '</div>'+
      '<div class="stat-card">'+
        '<div class="stat-icon">⚖️</div>'+
        '<input type="number" inputmode="decimal" step="0.1" placeholder="0.0" value="'+(dd.peso||'')+'" class="stat-val'+(dd.peso?'':' empty')+'" style="border:none;background:transparent;width:100%;font-size:34px;font-weight:900;letter-spacing:-2px;color:var(--text);padding:0;font-family:var(--font)" onchange="saveDayField('+di+',\'peso\',this.value)" onfocus="this.select()">'+
        '<div class="stat-lbl">Peso</div>'+
        '<div class="stat-sub">kg'+(ultimoPeso?' · último: '+ultimoPeso:' · primer registro')+'</div>'+
      '</div>'+
      '<div class="stat-card">'+
        '<div class="stat-icon">🏃</div>'+
        '<input type="text" placeholder="fútbol, caminar…" value="'+(dd.entreno||'')+'" class="stat-val-sm'+(dd.entreno?'':' empty')+'" style="border:none;background:transparent;width:100%;font-size:17px;font-weight:700;letter-spacing:-0.5px;color:var(--text);padding:0;font-family:var(--font);margin-top:4px" onchange="saveDayField('+di+',\'entreno\',this.value)">'+
        '<div class="stat-lbl">Actividad extra</div>'+
        '<div class="stat-sub">fuera del gym</div>'+
      '</div>'+
    '</div>'+
    '<div class="home-gap"></div>'+
    '<div class="week-card">'+
      '<div class="week-section-lbl">Esta semana</div>'+
      '<div class="week-days-row">'+
        SHORT.map((d,i)=>{
          const w=wd[i]||{},hasData=w.pasos||w.sueno||w.peso,isT=i===todayI,isSel=i===di,plan=weekPlan[i];
          let cls='day-pill';
          if(isSel)cls+=' selected';
          else if(isT)cls+=' today';
          else if(hasData)cls+=' has-data';
          return '<div class="week-day" onclick="selectHomeDay('+i+')">'+
            '<div class="'+cls+'">'+d+'</div>'+
            '<div class="day-plan-lbl'+(SESSIONS.includes(plan)?' train':'')+'">'+
              (SESSIONS.includes(plan)?plan.substring(0,2):'·')+
            '</div>'+
          '</div>';
        }).join('')+
      '</div>'+
    '</div>'+
    '<div class="home-gap"></div>'+
    '<div class="export-btn" onclick="exportCSV()">📥 Exportar registro semanal</div>'+
  '</div>';
}

function renderTrain(){
  const wk=weekKey(),di=state.selectedDay,todayI=todayIdx();
  const dd=getDayData(wk,di),weekPlan=getWeekPlan(wk);
  const active=dd.sessionOverride||weekPlan[di];
  const current=state.trainSession||(SESSIONS.includes(active)?active:SESSIONS[0]);
  const exs=MESO2[current]||[];
  const wd=gymData[wk]||{};

  return '<div class="scroll-wrap">'+
    '<div class="card">'+
      '<div class="card-title">Día</div>'+
      '<div class="week-days-row" style="display:flex;justify-content:space-between;margin-bottom:12px">'+
        SHORT.map((d,i)=>{
          const w=wd[i]||{},done=w.sessionSaved,isT=i===todayI,isSel=i===di;
          let cls='day-pill';
          if(isSel)cls+=' selected';
          else if(isT)cls+=' today';
          else if(done)cls+=' has-data';
          return '<div style="display:flex;flex-direction:column;align-items:center;gap:3px">'+
            '<div class="'+cls+'" onclick="selectTrainDay('+i+')" style="width:34px;height:34px;font-size:11px">'+d+'</div>'+
            '<div style="font-size:9px;color:'+(done?'var(--green)':'var(--text3)')+';font-weight:600">'+(done?'✓':'·')+'</div>'+
          '</div>';
        }).join('')+
      '</div>'+
      '<div class="session-tabs">'+
        SESSIONS.map(s=>'<button class="session-tab'+(s===current?' active':'')+'" onclick="switchSession(\''+s+'\')">'+s+(s===active&&SESSIONS.includes(active)?' ·hoy':'')+'</button>').join('')+
      '</div>'+
      (SESSIONS.includes(active)
        ?'<div style="font-size:12px;color:var(--green);font-weight:600">✓ Plan '+DAYS[di]+': '+active+(dd.sessionOverride?' · cambiado':'')+'</div>'
        :'<div style="font-size:12px;color:var(--text2);font-weight:500">Descanso — selecciona sesión si entrenas.</div>')+
    '</div>'+
    (dd.sessionSaved?'<div class="session-complete-banner">✅ Sesión completada y guardada</div>':'')+
    '<div class="card">'+
      exs.map(ex=>{
        const prevSets=ex.p?ex.p.split('/'):[];
        const saved=(dd.sets&&dd.sets[ex.o])||[];
        const pending=state.pendingSets[ex.o]||[];
        const exSaved=dd.savedExercises&&dd.savedExercises[ex.o];
        return '<div class="exercise-row">'+
          '<div style="display:flex;align-items:flex-start;justify-content:space-between">'+
            '<div>'+
              '<div class="exercise-name">'+ex.o+'. '+ex.n+'</div>'+
              '<div class="exercise-meta">'+ex.s+' series · '+ex.r+' · ⏱ '+ex.d+"'</div>"+
              (ex.p?'<div class="prev-badge">ant: '+ex.p+'</div>':'')+
            '</div>'+
            (exSaved?'<span style="font-size:11px;color:var(--green);font-weight:700">✓ guardado</span>':'')+
          '</div>'+
          '<div style="margin-top:6px">'+
            Array(ex.s).fill(0).map((_,si)=>{
              const pv=prevSets[si]||'';
              const sv=saved[si]||pending[si]||{reps:'',kg:''};
              return '<div class="set-row">'+
                '<span class="set-num">S'+(si+1)+'</span>'+
                '<div class="set-inputs">'+
                  '<input type="number" inputmode="numeric" placeholder="reps" value="'+(sv.reps||'')+'" class="set-inp" onchange="setPending('+ex.o+','+si+',\'reps\',this.value)">'+
                  '<span class="set-sep">x</span>'+
                  '<input type="number" inputmode="decimal" placeholder="kg" value="'+(sv.kg||'')+'" step="0.5" class="set-inp" onchange="setPending('+ex.o+','+si+',\'kg\',this.value)">'+
                '</div>'+
                '<div class="set-right">'+
                  (pv?'<span class="set-prev">'+pv+'</span>':'')+
                  '<button class="timer-btn" onclick="startTimer('+ex.d+',\''+ex.n.replace(/'/g,"\'")+'\')" >▶</button>'+
                '</div>'+
              '</div>';
            }).join('')+
          '</div>'+
          '<button class="btn-save" onclick="saveExercise('+ex.o+','+ex.s+')">'+(exSaved?'✏️ Actualizar':'💾 Guardar ejercicio')+'</button>'+
        '</div>';
      }).join('')+
      '<div style="margin-top:12px">'+
        '<div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;margin-bottom:6px">Notas</div>'+
        '<textarea class="inp" placeholder="Sensaciones, PR, lesiones…" onchange="saveDayField('+di+',\'notas\',this.value)">'+dd.notas+'</textarea>'+
      '</div>'+
    '</div>'+
    '<div class="divider"></div>'+
    '<button class="btn btn-primary btn-block" onclick="saveFullSession(\''+current+'\','+di+')" style="margin-bottom:8px">🏆 Guardar sesión — '+current+'</button>'+
    '<button class="btn btn-green-soft btn-block" onclick="exportTrainingPlan()" style="margin-bottom:4px">📥 Exportar plan de entrenamiento</button>'+
  '</div>';
}

      '<div class="diet-tabs">'+DAYS.map((d,i)=>'<button class="diet-day-btn'+(i===sel?' active':'')+'" onclick="selectDietDay('+i+')">'+d.substring(0,3)+'</button>').join('')+'</div>'+
    '</div>'+
    '<div class="card">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'+
        '<div style="font-size:18px;font-weight:800;color:var(--text);letter-spacing:-0.5px">'+dayName+'</div>'+
        (sel===todayIdx()?'<span style="background:var(--green-dim);color:var(--green);font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;border:1px solid rgba(26,77,26,0.2)">Hoy</span>':'')+
      '</div>'+
      '<div style="font-size:12px;color:var(--text3);margin-bottom:14px;font-weight:500">💧 3 litros de agua · Café sin azúcar</div>'+
      ['desayuno','comida','merienda','cena'].map(c=>
        '<div class="food-block">'+
          '<div class="food-header"><div class="food-icon">'+emojis[c]+'</div><span class="food-name">'+labels[c]+'</span></div>'+
          '<div class="food-content">'+diet[c]+'</div>'+
        '</div>'
      ).join('')+
    '</div>'+

}

function renderCheats(){
  const cheats=gymData.cheats||[];
  const now=new Date();
  const thisMonth=cheats.filter(c=>{if(!c.fecha)return false;const p=c.fecha.split('/');return parseInt(p[1])===now.getMonth()+1&&parseInt(p[2])===now.getFullYear();}).length;
  return '<div class="scroll-wrap">'+
    '<div class="card">'+
      '<div class="card-title">Cheat meals</div>'+
      '<div style="font-size:13px;color:var(--text2);margin-bottom:12px;font-weight:500">Registra tus comidas trampa para mantener el control sin obsesionarte</div>'+
      '<button class="btn btn-primary btn-block" onclick="toggleCheatForm()">🍔 Añadir cheat meal</button>'+
    '</div>'+
    (state.showCheatForm?
      '<div class="cheat-form">'+
        '<div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px">🍔 Nuevo cheat meal</div>'+
        '<label class="section-label">¿Qué comiste?</label>'+
        '<input type="text" id="cf-nombre" class="inp" placeholder="Hamburguesa, pizza…" style="margin-bottom:10px">'+
        '<label class="section-label">¿Qué día fue?</label>'+
        '<select id="cf-dia" class="inp" style="margin-bottom:10px">'+
          DAYS.map((d,i)=>'<option value="'+i+'"'+(i===todayIdx()?' selected':'')+'>'+d+(i===todayIdx()?' (hoy)':'')+'</option>').join('')+
        '</select>'+
        '<label class="section-label">¿En qué momento?</label>'+
        '<select id="cf-comida" class="inp" style="margin-bottom:10px">'+
          '<option value="comida">Comida</option><option value="cena">Cena</option><option value="desayuno">Desayuno</option><option value="merienda">Merienda</option>'+
        '</select>'+
        '<label class="section-label">Notas (opcional)</label>'+
        '<textarea id="cf-notas" class="inp" style="margin-bottom:14px" placeholder="Con quién, dónde…"></textarea>'+
        '<div style="display:flex;gap:8px">'+
          '<button class="btn" onclick="toggleCheatForm()" style="flex:1">Cancelar</button>'+
          '<button class="btn btn-primary" onclick="submitCheat()" style="flex:1">✓ Guardar</button>'+
        '</div>'+
      '</div>':'')+
    (cheats.length>0?
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'+
        '<div class="card" style="margin-bottom:0"><div style="font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.4px">Este mes</div><div style="font-size:36px;font-weight:900;color:var(--text);letter-spacing:-2px">'+thisMonth+'</div><div style="font-size:10px;color:var(--text3);font-weight:500">cheat meals</div></div>'+
        '<div class="card" style="margin-bottom:0"><div style="font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.4px">Total</div><div style="font-size:36px;font-weight:900;color:var(--text);letter-spacing:-2px">'+cheats.length+'</div><div style="font-size:10px;color:var(--text3);font-weight:500">registrados</div></div>'+
      '</div>':'')+
    (cheats.length===0&&!state.showCheatForm?
      '<div class="empty-state"><div class="empty-icon">🍔</div><div class="empty-title">Sin cheats registrados</div><div class="empty-sub">Cuando te saltes la dieta, anótalo aquí. Sin dramas, solo control.</div></div>':'')+
    (cheats.length>0?
      '<div class="card">'+
        cheats.slice().reverse().map((ch,ri)=>{
          const i=cheats.length-1-ri;
          return '<div class="cheat-item">'+
            '<div style="width:42px;height:42px;border-radius:11px;background:var(--coral-light);border:1px solid rgba(155,44,44,0.15);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">🍔</div>'+
            '<div style="flex:1;min-width:0">'+
              '<div style="font-size:14px;font-weight:700;color:var(--text)">'+(ch.nombre||'Cheat meal')+'</div>'+
              '<div style="font-size:11px;color:var(--text3);font-weight:500;margin-top:2px">'+(ch.dia!==undefined?DAYS[ch.dia]+' · ':'')+ch.fecha+' · '+(ch.comida||'')+'</div>'+
              (ch.notas?'<div style="font-size:12px;color:var(--text2);margin-top:3px">'+ch.notas+'</div>':'')+
            '</div>'+

function toggleWeekReorder(){state.showWeekReorder=!state.showWeekReorder;render();}
function renderWeekReorder(wk,weekPlan){
  const opts=['DESCANSO',...SESSIONS];
  return '<div style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:10px 12px;margin-top:6px">'+
    '<div style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.8);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px">Ajusta el plan de la semana</div>'+
    DAYS.map((d,i)=>
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">'+
        '<span style="font-size:11px;color:rgba(255,255,255,0.6);min-width:22px;font-weight:600">'+SHORT[i]+'</span>'+
        '<select onchange="setWeekDayPlan('+i+',this.value,\''+wk+'\')" style="flex:1;padding:5px 8px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;font-size:11px;background:rgba(255,255,255,0.1);color:#fff;font-family:var(--font);font-weight:600">'+
          opts.map(o=>'<option value="'+o+'" style="background:#1a4d1a;color:#fff"'+(weekPlan[i]===o?' selected':'')+'>'+o+'</option>').join('')+
        '</select>'+
      '</div>'
    ).join('')+
    '<button onclick="toggleWeekReorder()" style="width:100%;margin-top:6px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:6px;padding:6px;font-size:11px;font-weight:700;font-family:var(--font);cursor:pointer">✓ Cerrar</button>'+
  '</div>';
}
function setWeekDayPlan(di,val,wk){
  if(!gymData.weekPlan)gymData.weekPlan={};
  if(!gymData.weekPlan[wk])gymData.weekPlan[wk]=[...DEFAULT_PLAN];
  gymData.weekPlan[wk][di]=val;
  localStorage.setItem(STORE_KEY,JSON.stringify(gymData));
  showToast('Plan actualizado ✓');
  render();
}
function selectTrainDay(i){state.selectedDay=i;state.pendingSets={};state.trainSession=null;render();}
function selectDietDay(i){state.dietDay=i;render();}
function toggleCheatForm(){state.showCheatForm=!state.showCheatForm;render();}
function setOverrideForDay(di,val){
  const dd=getDayData(weekKey(),di);
  dd.sessionOverride=val===weekKey()?null:val;
  const plan=getWeekPlan(weekKey())[di];
  if(val===plan)dd.sessionOverride=null;
  else dd.sessionOverride=val;
  if(val&&SESSIONS.includes(val))state.trainSession=val;
  saveData(gymData);render();
}
function saveDayField(di,field,value){const dd=getDayData(weekKey(),di);dd[field]=value;saveData(gymData);}
function setPending(exO,si,field,value){if(!state.pendingSets[exO])state.pendingSets[exO]=[];if(!state.pendingSets[exO][si])state.pendingSets[exO][si]={reps:'',kg:''};state.pendingSets[exO][si][field]=value;}
function saveExercise(exO,numSeries){
  const di=state.selectedDay,dd=getDayData(weekKey(),di);
  if(!dd.sets)dd.sets={};if(!dd.savedExercises)dd.savedExercises={};
  const pending=state.pendingSets[exO]||[];
  dd.sets[exO]=dd.sets[exO]||[];
  for(let si=0;si<numSeries;si++){const p=pending[si];if(p&&(p.reps||p.kg))dd.sets[exO][si]={reps:p.reps||'',kg:p.kg||''};}
  dd.savedExercises[exO]=true;
  delete state.pendingSets[exO];
  saveData(gymData);render();
}
function saveFullSession(sessionName,di){
  const dd=getDayData(weekKey(),di);
  Object.keys(state.pendingSets).forEach(exO=>{
    const pending=state.pendingSets[exO];
    if(!dd.sets)dd.sets={};if(!dd.savedExercises)dd.savedExercises={};
    if(pending)dd.sets[exO]=pending;dd.savedExercises[exO]=true;
  });
  state.pendingSets={};dd.sessionSaved=true;dd.sessionName=sessionName;
  saveData(gymData);showToast('Sesión guardada ✓');render();
}
function switchSession(s){state.trainSession=s;render();}
function submitCheat(){
  const nombre=document.getElementById('cf-nombre').value.trim();if(!nombre)return;
  const diaIdx=parseInt(document.getElementById('cf-dia').value);
  const comida=document.getElementById('cf-comida').value;
  const notas=document.getElementById('cf-notas').value.trim();
  const now=new Date(),fecha=now.getDate()+'/'+(now.getMonth()+1)+'/'+now.getFullYear();
  if(!gymData.cheats)gymData.cheats=[];
  gymData.cheats.push({nombre,dia:diaIdx,comida,notas,fecha});
  state.showCheatForm=false;saveData(gymData);render();
}
function deleteCheat(i){if(confirm('¿Eliminar?')){gymData.cheats.splice(i,1);saveData(gymData);render();}}
function exportCSV(){
  const wk=weekKey(),wd=gymData[wk]||{},weekPlan=getWeekPlan(wk);
  let csv='Día,Plan,Sesión real,Actividad extra,Pasos,Peso (kg),Sueño (h),Notas\n';
  DAYS.forEach((d,i)=>{const dd=wd[i]||{},plan=weekPlan[i],real=dd.sessionOverride||plan;csv+=d+','+plan+','+real+','+(dd.entreno||'')+','+(dd.pasos||'')+','+(dd.peso||'')+','+(dd.sueno||'')+','+(dd.notas||'')+'\n';});
  downloadBlob(csv,'registro_'+wk+'.csv','text/csv;charset=utf-8');
}
function exportTrainingPlan(){
  const current=state.trainSession||SESSIONS[0],di=state.selectedDay,dd=getDayData(weekKey(),di);
  const exs=MESO2[current]||[];
  let csv='Plan '+current+' — '+DAYS[di]+'\n\nEjercicio,Series,Reps,Descanso,Anterior,S1 Reps,S1 Kg,S2 Reps,S2 Kg,S3 Reps,S3 Kg\n';
  exs.forEach(ex=>{const sets=dd.sets&&dd.sets[ex.o]?dd.sets[ex.o]:[];const setsStr=Array(ex.s).fill(0).map((_,si)=>{const s=sets[si]||{};return (s.reps||'')+(','+(s.kg||''));}).join(',');csv+=ex.n+','+ex.s+',"'+ex.r+'",'+ex.d+"',"+ex.p+','+setsStr+'\n';});
  downloadBlob(csv,'entreno_'+current+'_'+DAYS[di]+'.csv','text/csv;charset=utf-8');
}
function downloadBlob(content,filename,type){const blob=new Blob(['\ufeff'+content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);}

function startTimer(mins,exName){
  clearInterval(timerInt);timerTotal=mins*60;timerSec=timerTotal;
  document.getElementById('timer-ex-name').textContent=exName;
  document.getElementById('timer-display').style.color='var(--green)';
  updateTimerDisplay();document.getElementById('timer-overlay').classList.add('open');
  timerInt=setInterval(()=>{
    if(timerSec<=0){clearInterval(timerInt);document.getElementById('timer-display').textContent='¡Listo!';return;}
    timerSec--;updateTimerDisplay();
    const pct=timerSec/timerTotal;
    document.getElementById('timer-display').style.color=pct<0.25?'var(--coral)':pct<0.5?'var(--amber)':'var(--green)';
  },1000);
}
function updateTimerDisplay(){const m=Math.floor(timerSec/60),s=timerSec%60;document.getElementById('timer-display').textContent=m+':'+s.toString().padStart(2,'0');}
function resetTimer(){clearInterval(timerInt);timerSec=timerTotal;document.getElementById('timer-display').style.color='var(--green)';updateTimerDisplay();timerInt=setInterval(()=>{if(timerSec<=0){clearInterval(timerInt);document.getElementById('timer-display').textContent='¡Listo!';return;}timerSec--;updateTimerDisplay();const pct=timerSec/timerTotal;document.getElementById('timer-display').style.color=pct<0.25?'var(--coral)':pct<0.5?'var(--amber)':'var(--green)';},1000);}
function closeTimer(){clearInterval(timerInt);document.getElementById('timer-overlay').classList.remove('open');}
function closeTimerOutside(e){if(e.target===document.getElementById('timer-overlay'))closeTimer();}

const now=new Date();
document.getElementById('greeting').textContent=greeting();
document.getElementById('header-date').textContent=DAYS[todayIdx()]+', '+now.getDate()+'/'+(now.getMonth()+1)+'/'+now.getFullYear();
state.trainSession=SESSIONS.includes(DEFAULT_PLAN[todayIdx()])?DEFAULT_PLAN[todayIdx()]:SESSIONS[0];
render();
</script>
