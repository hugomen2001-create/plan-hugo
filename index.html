<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F5F2;
  --bg2:#FFFFFF;
  --bg3:#EFEFEC;
  --border:#E8E8E4;
  --border2:#DCDCD8;
  --text:#111111;
  --text2:#555555;
  --text3:#AAAAAA;
  --green:#1A4D1A;
  --green-mid:#2A6B2A;
  --green-light:#EDF5ED;
  --green-dim:#D4EDD4;
  --amber:#B45309;
  --amber-light:#FEF3C7;
  --coral:#9B2C2C;
  --coral-light:#FEE2E2;
  --font:'Inter',sans-serif;
  --mono:'Inter',monospace;
}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font);color:var(--text)}

.app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:430px;margin:0 auto;overflow:hidden}

/* HEADER */
.header{flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 20px 14px;padding-top:calc(16px + env(safe-area-inset-top))}
.header-greeting{font-size:12px;color:var(--text3);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px}
.header-title{font-size:28px;font-weight:900;color:var(--text);letter-spacing:-1.5px;line-height:1}
.header-row{display:flex;align-items:flex-start;justify-content:space-between}
.header-sub{font-size:12px;color:var(--text3);margin-top:3px;font-weight:400}
.header-badge{background:var(--green);color:#fff;font-size:11px;font-weight:700;padding:5px 13px;border-radius:20px;letter-spacing:0.3px;white-space:nowrap;margin-top:2px}

/* CONTENT */
.content{flex:1;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg);min-height:0}
.content.scrollable{overflow-y:auto;overscroll-behavior-y:contain}
.content.fixed{overflow-y:hidden}

/* HOME — fills exactly, no scroll ever */
.home-wrap{display:flex;flex-direction:column;height:100%;padding:10px;gap:8px}
/* OTHER TABS */
.scroll-wrap{padding:12px 12px 20px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0}

/* TODAY CARD */
.today-card{background:var(--green);border-radius:20px;padding:18px 20px;flex-shrink:0;position:relative;overflow:hidden}
.today-card-glow{position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.06);pointer-events:none}
.today-label{font-size:11px;color:rgba(255,255,255,0.55);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px}
.today-session{font-size:40px;font-weight:900;color:#fff;letter-spacing:-2px;line-height:1.05}
.today-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
.today-badge{background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.25);color:#fff;font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px}
.today-sub{font-size:12px;color:rgba(255,255,255,0.55);font-weight:400;margin-bottom:10px}

.activity-val{font-size:13px;font-weight:600;color:var(--text)}

.cheat-item:last-child{border-bottom:none}

.timer-ring{font-size:64px;font-weight:900;color:var(--green);letter-spacing:-3px;font-variant-numeric:tabular-nums;margin:12px 0;transition:color 0.5s}

/* WEEK REORDER */
.week-reorder{background:var(--amber-light);border:1px solid rgba(180,83,9,0.2);border-radius:10px;padding:12px 14px;margin-top:10px}
.week-day-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.week-day-lbl{font-size:12px;color:var(--text2);min-width:28px;font-weight:600}
.week-day-select{flex:1;padding:6px 10px;border:1px solid var(--border2);border-radius:8px;font-size:12px;background:var(--bg2);color:var(--text);font-family:var(--font);-webkit-appearance:none;appearance:none;font-weight:500}
</style>
</head>

</div>

let state={tab:'home',selectedDay:todayIdx(),trainSession:null,dietDay:todayIdx(),showCheatForm:false,showWeekReorder:false,pendingSets:{}};
let timerInt=null,timerSec=0,timerTotal=0;
const STORE_KEY='hugo_gym_v2';
function loadData(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{}')}catch{return{}}}
function saveData(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d));showToast('Guardado ✓')}catch(e){}}
let gymData=loadData();

function weekKey(){const d=new Date(),j=new Date(d.getFullYear(),0,1);return d.getFullYear()+'-W'+Math.ceil(((d-j)/86400000+j.getDay()+1)/7);}
function todayIdx(){const d=new Date().getDay();return d===0?6:d-1;}
function getWeekPlan(wk){if(!gymData.weekPlan)gymData.weekPlan={};return gymData.weekPlan[wk]?[...gymData.weekPlan[wk]]:[...DEFAULT_PLAN];}
function getDayData(wk,di){if(!gymData[wk])gymData[wk]={};if(!gymData[wk][di])gymData[wk][di]={pasos:'',peso:'',sueno:'',entreno:'',sets:{},notas:'',sessionOverride:null,sessionSaved:false};return gymData[wk][di];}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg||'Guardado ✓';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function greeting(){const h=new Date().getHours();return h<12?'Buenos días':h<20?'Buenas tardes':'Buenas noches';}

function switchTab(tab){
  state.tab=tab;
  state.selectedDay=todayIdx();
  state.showWeekReorder=false;
  ['home','train','diet','cheats'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('active',x===tab));
  render();
}

function render(){
  const c=document.getElementById('main-content');
  if(state.tab==='home'){
    c.style.overflow='hidden';
    c.innerHTML=renderHome();
  } else {
    c.style.overflowY='auto';
    c.style.overflowX='hidden';
    if(state.tab==='train')c.innerHTML=renderTrain();
    else if(state.tab==='diet')c.innerHTML=renderDiet();
    else if(state.tab==='cheats')c.innerHTML=renderCheats();
  }
  setTimeout(initDragList,0);
}

function renderHome(){
  const wk=weekKey(),di=state.selectedDay,todayI=todayIdx();
  const dd=getDayData(wk,di),weekPlan=getWeekPlan(wk);

  document.getElementById('greeting').textContent=greeting();

  document.getElementById('header-date').textContent=isToday
    ?DAYS[di]+', '+now.getDate()+'/'+(now.getMonth()+1)+'/'+now.getFullYear()

  const pesos=[0,1,2,3,4,5,6].map(i=>wd[i]&&wd[i].peso?parseFloat(wd[i].peso):null).filter(Boolean);

      '<div class="today-sub">'+(isTrain?'Sesión según tu plan semanal':'Día de descanso · Recuperación activa')+'</div>'+

        SESSIONS.map(s=>'<div class="change-chip'+(s===active?' chip-active':'')+'" onclick="setOverrideForDay('+di+',\''+s+'\')">'+s+'</div>').join('')+
        '<div class="change-chip'+(active==='DESCANSO'?' chip-active':'')+'" onclick="setOverrideForDay('+di+',\'DESCANSO\')">DSC</div>'+
      '</div>'+
      // Reorganizar semana: solo si el día tiene override Y es un entreno que no era el planificado
      (dd.sessionOverride && dd.sessionOverride !== weekPlan[di] ?
        '<div style="margin-top:8px">'+
          '<button onclick="toggleWeekReorder()" style="width:100%;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.85);border-radius:8px;padding:7px;font-size:11px;font-weight:700;font-family:var(--font);cursor:pointer;text-align:center">'+
            '📅 Reorganizar semana'+
          '</button>'+
          (state.showWeekReorder?renderWeekReorder(weekKey(),weekPlan):'')+
        '</div>' : '')+

    '<div class="stat-grid">'+
      '<div class="stat-card">'+
        '<div class="stat-icon">👟</div>'+

        '<div class="progress-bg"><div class="progress-fill" style="width:'+pasosW+'%"></div></div>'+
        '<button class="evolution-btn" onclick="openMetricModal(event,\'pasos\')">📊 Ver evolución</button>'+

        '<div class="stat-icon">🌙</div>'+
        '<input type="number" inputmode="decimal" step="0.5" placeholder="0" value="'+(dd.sueno||'')+'" class="stat-val'+(dd.sueno?'':' empty')+'" onchange="saveDayField('+di+',\'sueno\',this.value)" onfocus="this.select()">'+

        '<button class="evolution-btn" onclick="openMetricModal(event,\'peso\')">📊 Ver evolución</button>'+
        '<div class="stat-lbl">Peso</div>'+

      '</div>'+

    '<div class="card">'+
      '<div class="card-title">Día</div>'+

          '</div>';

      '<div class="session-tabs">'+
        SESSIONS.map(s=>'<button class="session-tab'+(s===current?' active':'')+'" onclick="switchSession(\''+s+'\')">'+s+(s===active&&SESSIONS.includes(active)?' ·hoy':'')+'</button>').join('')+

        :'<div style="font-size:12px;color:var(--text2);font-weight:500">Descanso — selecciona sesión si entrenas.</div>')+
    '</div>'+
    (dd.sessionSaved?'<div class="session-complete-banner">✅ Sesión completada y guardada</div>':'')+

      exs.map(ex=>{
        const prevSets=ex.p?ex.p.split('/'):[];

        const pending=state.pendingSets[ex.o]||[];
        const exSaved=dd.savedExercises&&dd.savedExercises[ex.o];
        return '<div class="exercise-row">'+
          '<div style="display:flex;align-items:flex-start;justify-content:space-between">'+
            '<div>'+
              '<div class="exercise-name">'+ex.o+'. '+ex.n+'</div>'+
              '<div class="exercise-meta">'+ex.s+' series · '+ex.r+' · ⏱ '+ex.d+"'</div>"+
              (ex.p?'<div class="prev-badge">ant: '+ex.p+'</div>':'')+
            '</div>'+
            (exSaved?'<span style="font-size:11px;color:var(--green);font-weight:700">✓ guardado</span>':'')+
          '</div>'+
          '<div style="margin-top:6px">'+
            Array(ex.s).fill(0).map((_,si)=>{
              const pv=prevSets[si]||'';

              return '<div class="set-row">'+
                '<span class="set-num">S'+(si+1)+'</span>'+
                '<div class="set-inputs">'+
                  '<input type="number" inputmode="numeric" placeholder="reps" value="'+(sv.reps||'')+'" class="set-inp" onchange="setPending('+ex.o+','+si+',\'reps\',this.value)">'+

                  '<input type="number" inputmode="decimal" placeholder="kg" value="'+(sv.kg||'')+'" step="0.5" class="set-inp" onchange="setPending('+ex.o+','+si+',\'kg\',this.value)">'+
                '</div>'+
                '<div class="set-right">'+
                  (pv?'<span class="set-prev">'+pv+'</span>':'')+
                  '<button class="timer-btn" onclick="startTimer('+ex.d+',\''+ex.n.replace(/'/g,"\'")+'\')" >▶</button>'+

              '</div>';
            }).join('')+
          '</div>'+
          '<button class="btn-save" onclick="saveExercise('+ex.o+','+ex.s+')">'+(exSaved?'✏️ Actualizar':'💾 Guardar ejercicio')+'</button>'+
        '</div>';
      }).join('')+
      '<div style="margin-top:12px">'+
        '<div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;margin-bottom:6px">Notas</div>'+

  '</div>';

function setWeekDayPlan(di,val,wk){

  showToast('Plan actualizado ✓');

}
function initDragList(){
  const list=document.getElementById('drag-list');
  if(!list)return;
  let dragEl=null,dragIdx=null;
  const items=()=>[...list.querySelectorAll('.drag-item')];
  const getIdx=el=>parseInt(el.dataset.idx);

  // Touch support
  list.addEventListener('touchstart',e=>{
    const el=e.target.closest('.drag-item');if(!el)return;
    dragEl=el;dragIdx=getIdx(el);
    el.style.opacity='0.5';el.style.boxShadow='0 6px 20px rgba(0,0,0,0.15)';
  },{passive:true});
  list.addEventListener('touchmove',e=>{
    if(!dragEl)return;
    e.preventDefault();
    const touch=e.touches[0];
    const target=document.elementFromPoint(touch.clientX,touch.clientY)?.closest('.drag-item');
    if(target&&target!==dragEl){
      const tIdx=getIdx(target);
      const els=items();
      if(tIdx>dragIdx)list.insertBefore(dragEl,target.nextSibling);
      else list.insertBefore(dragEl,target);
      dragIdx=tIdx;
    }
  },{passive:false});
  list.addEventListener('touchend',()=>{
    if(!dragEl)return;
    dragEl.style.opacity='1';dragEl.style.boxShadow='';
    saveDragOrder();dragEl=null;dragIdx=null;
  });

  // Mouse support
  list.addEventListener('dragstart',e=>{
    const el=e.target.closest('.drag-item');if(!el)return;
    dragEl=el;setTimeout(()=>el.style.opacity='0.5',0);
  });
  list.addEventListener('dragover',e=>{
    e.preventDefault();
    const target=e.target.closest('.drag-item');
    if(target&&target!==dragEl){
      const box=target.getBoundingClientRect();
      if(e.clientY<box.top+box.height/2)list.insertBefore(dragEl,target);
      else list.insertBefore(dragEl,target.nextSibling);
    }
  });
  list.addEventListener('dragend',()=>{
    if(dragEl)dragEl.style.opacity='1';
    saveDragOrder();dragEl=null;
  });

  function saveDragOrder(){
    const wk=weekKey();
    if(!gymData.weekPlan)gymData.weekPlan={};
    const els=items();
    const oldPlan=getWeekPlan(wk);
    // Build new plan: position in list = day of week, value = plan of original day
    const newPlan=els.map(el=>oldPlan[getIdx(el)]);
    gymData.weekPlan[wk]=newPlan;
    localStorage.setItem(STORE_KEY,JSON.stringify(gymData));
    // Update data-idx to new positions
    els.forEach((el,i)=>el.dataset.idx=i);
    showToast('Semana reorganizada ✓');
  }
}

function setPending(exO,si,field,value){if(!state.pendingSets[exO])state.pendingSets[exO]=[];if(!state.pendingSets[exO][si])state.pendingSets[exO][si]={reps:'',kg:''};state.pendingSets[exO][si][field]=value;}
function saveExercise(exO,numSeries){
  const di=state.selectedDay,dd=getDayData(weekKey(),di);
  if(!dd.sets)dd.sets={};if(!dd.savedExercises)dd.savedExercises={};
  const pending=state.pendingSets[exO]||[];
  dd.sets[exO]=dd.sets[exO]||[];
  for(let si=0;si<numSeries;si++){const p=pending[si];if(p&&(p.reps||p.kg))dd.sets[exO][si]={reps:p.reps||'',kg:p.kg||''};}
  dd.savedExercises[exO]=true;
  delete state.pendingSets[exO];
  saveData(gymData);render();
}
function saveFullSession(sessionName,di){
  const dd=getDayData(weekKey(),di);
  Object.keys(state.pendingSets).forEach(exO=>{
    const pending=state.pendingSets[exO];
    if(!dd.sets)dd.sets={};if(!dd.savedExercises)dd.savedExercises={};
    if(pending)dd.sets[exO]=pending;dd.savedExercises[exO]=true;
  });
  state.pendingSets={};dd.sessionSaved=true;dd.sessionName=sessionName;
  saveData(gymData);showToast('Sesión guardada ✓');render();
}

function downloadBlob(content,filename,type){const blob=new Blob(['\ufeff'+content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);}

function startTimer(mins,exName){
  clearInterval(timerInt);timerTotal=mins*60;timerSec=timerTotal;
  document.getElementById('timer-ex-name').textContent=exName;
  document.getElementById('timer-display').style.color='var(--green)';
  updateTimerDisplay();document.getElementById('timer-overlay').classList.add('open');
  timerInt=setInterval(()=>{
    if(timerSec<=0){clearInterval(timerInt);document.getElementById('timer-display').textContent='¡Listo!';return;}
    timerSec--;updateTimerDisplay();
    const pct=timerSec/timerTotal;
    document.getElementById('timer-display').style.color=pct<0.25?'var(--coral)':pct<0.5?'var(--amber)':'var(--green)';
  },1000);
}
function updateTimerDisplay(){const m=Math.floor(timerSec/60),s=timerSec%60;document.getElementById('timer-display').textContent=m+':'+s.toString().padStart(2,'0');}
function resetTimer(){clearInterval(timerInt);timerSec=timerTotal;document.getElementById('timer-display').style.color='var(--green)';updateTimerDisplay();timerInt=setInterval(()=>{if(timerSec<=0){clearInterval(timerInt);document.getElementById('timer-display').textContent='¡Listo!';return;}timerSec--;updateTimerDisplay();const pct=timerSec/timerTotal;document.getElementById('timer-display').style.color=pct<0.25?'var(--coral)':pct<0.5?'var(--amber)':'var(--green)';},1000);}
function closeTimer(){clearInterval(timerInt);document.getElementById('timer-overlay').classList.remove('open');}
function closeTimerOutside(e){if(e.target===document.getElementById('timer-overlay'))closeTimer();}

// ── METRIC MODALS ──
let selectedMetricBar=null;

function getMetricWeekData(metric){
  const wk=weekKey(),wd=gymData[wk]||{};
  return [0,1,2,3,4,5,6].map(i=>{const d=wd[i]||{};const val=d[metric];return val!==undefined&&val!==''?parseFloat(val):null;});
}

function openMetricModal(event,metric){
  event.stopPropagation();selectedMetricBar=null;
  document.getElementById('metric-title').textContent=metric==='pasos'?'Pasos':metric==='sueno'?'Sueño':'Peso';
  document.getElementById('metric-body').innerHTML=renderMetricModal(metric);
  document.getElementById('metric-overlay').style.display='flex';
}

function closeMetricModal(event){

  document.getElementById('metric-overlay').style.display='none';
}

function selectMetricBar(index,metric){selectedMetricBar=index;document.getElementById('metric-body').innerHTML=renderMetricModal(metric);}

function renderMetricModal(metric){
  const data=getMetricWeekData(metric);
  const validData=data.filter(v=>v!==null);
  const max=Math.max(...data.map(v=>v||0),1);

  const periods='<div class="period-selector">'+['D','S','M','6M','A'].map(p=>'<div class="period-btn'+(p==='S'?' active':'')+'" onclick="void(0)">'+p+'</div>').join('')+'</div>';

  let tooltip='';
  if(selectedMetricBar!==null&&data[selectedMetricBar]!==null){
    const v=data[selectedMetricBar];
    const lbl=metric==='pasos'?v.toLocaleString()+' pasos':metric==='sueno'?v+'h':v+' kg';
    tooltip='<div class="bar-tooltip">'+DAYS[selectedMetricBar]+' · '+lbl+'</div>';
  }

  let chartHtml='';
  if(metric==='peso'&&validData.length>=2){
    const points=data.map((v,i)=>v!==null?{x:i,y:v}:null).filter(Boolean);
    const minV=Math.min(...points.map(p=>p.y)),maxV=Math.max(...points.map(p=>p.y)),range=maxV-minV||1;
    const W=260,H=80;
    const tx=i=>(i/6)*W,ty=v=>H-((v-minV)/range)*H*0.8-H*0.05;
    chartHtml='<div class="chart-wrap">'+
      '<svg class="line-chart-svg" viewBox="0 0 '+W+' '+H+'" style="height:80px;overflow:visible">'+
        '<polyline points="'+points.map(p=>tx(p.x).toFixed(1)+','+ty(p.y).toFixed(1)).join(' ')+'" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
        points.map(p=>'<circle cx="'+tx(p.x).toFixed(1)+'" cy="'+ty(p.y).toFixed(1)+'" r="4" fill="var(--green)" stroke="white" stroke-width="1.5" onclick="selectMetricBar('+p.x+',\'peso\')"/>').join('')+
      '</svg>'+
      '<div style="display:flex;justify-content:space-between;margin-top:6px">'+SHORT.map(d=>'<span style="font-size:9px;font-weight:700;color:var(--text3);flex:1;text-align:center">'+d+'</span>').join('')+'</div>'+
    '</div>';
  } else {
    chartHtml='<div class="chart-wrap">'+
      (metric==='pasos'?'<div style="position:relative"><div style="position:absolute;bottom:'+(10000/max*90)+'%;left:0;right:0;border-top:1.5px dashed rgba(26,77,26,0.35)"></div></div>':'')+
      '<div class="bar-chart">'+
        data.map((v,i)=>{
          const h=v?Math.max(4,Math.round((v/max)*90)):3;
          const isSel=selectedMetricBar===i;
          return '<div class="bar-col" onclick="selectMetricBar('+i+',\''+metric+'\')">'+
            '<div class="bar-fill'+(isSel?' selected':'')+'" style="height:'+h+'px;'+(v?'':'opacity:0.25')+'"></div>'+
            '<div class="bar-lbl">'+SHORT[i]+'</div>'+
          '</div>';
        }).join('')+
      '</div>'+
    '</div>';
  }

  let summaryHtml='';
  if(metric==='pasos'){
    const total=validData.reduce((a,b)=>a+b,0),mediaV=validData.length?Math.round(total/validData.length):0;
    const best=validData.length?Math.max(...validData):0,worst=validData.length?Math.min(...validData):0;
    summaryHtml='<div class="summary-grid">'+
      '<div class="summary-card"><div class="summary-val">'+total.toLocaleString()+'</div><div class="summary-lbl">Total semana</div></div>'+
      '<div class="summary-card"><div class="summary-val">'+mediaV.toLocaleString()+'</div><div class="summary-lbl">Media diaria</div></div>'+
      '<div class="summary-card"><div class="summary-val">'+best.toLocaleString()+'</div><div class="summary-lbl">Mejor día</div></div>'+
      '<div class="summary-card"><div class="summary-val">'+worst.toLocaleString()+'</div><div class="summary-lbl">Peor día</div></div>'+
    '</div>';
    const insight=!validData.length?'Todavía no has registrado pasos esta semana.':mediaV<5000?'Esta semana tus pasos están bastante bajos.':mediaV<9000?'Esta semana llevas un nivel de pasos moderado.':'Buen ritmo: estás alcanzando una media alta de pasos.';
    summaryHtml+='<div class="insight-block"><div class="insight-title">Datos importantes</div><div class="insight-text">'+insight+'</div></div>';
  } else if(metric==='sueno'){
    const total=validData.reduce((a,b)=>a+b,0),mediaV=validData.length?(total/validData.length).toFixed(1):0;
    const best=validData.length?Math.max(...validData):0,worst=validData.length?Math.min(...validData):0;
    const bestDay=best&&data.indexOf(best)>=0?DAYS[data.indexOf(best)]:'—';
    summaryHtml='<div class="summary-grid">'+
      '<div class="summary-card"><div class="summary-val">'+mediaV+'h</div><div class="summary-lbl">Media semanal</div></div>'+
      '<div class="summary-card"><div class="summary-val">'+total.toFixed(1)+'h</div><div class="summary-lbl">Total semana</div></div>'+
      '<div class="summary-card"><div class="summary-val">'+best+'h</div><div class="summary-lbl">Mejor noche</div></div>'+
      '<div class="summary-card"><div class="summary-val">'+worst+'h</div><div class="summary-lbl">Menor registro</div></div>'+
    '</div>';
    const variance=validData.length>=2?Math.max(...validData)-Math.min(...validData):0;
    const insight=!validData.length?'Faltan datos de sueño en varios días.':validData.length<4?'Faltan datos de sueño en varios días. Tu media hasta ahora es '+mediaV+'h.':variance>2?'Hay bastante variación entre días. Tu media es '+mediaV+'h.':'Esta semana tu media de sueño ha sido de '+mediaV+'h. Tu noche con más sueño fue el '+bestDay+'.';
    summaryHtml+='<div class="insight-block"><div class="insight-title">Datos importantes</div><div class="insight-text">'+insight+'</div></div>';
  } else if(metric==='peso'){
    const mediaV=validData.length?(validData.reduce((a,b)=>a+b,0)/validData.length).toFixed(1):null;
    const last=validData.length?validData[validData.length-1]:null,high=validData.length?Math.max(...validData):null,low=validData.length?Math.min(...validData):null;
    const variation=validData.length>=2?(validData[validData.length-1]-validData[0]).toFixed(1):null;
    summaryHtml='<div class="summary-grid">'+
      '<div class="summary-card"><div class="summary-val">'+(mediaV?mediaV+'kg':'—')+'</div><div class="summary-lbl">Media semana</div></div>'+
      '<div class="summary-card"><div class="summary-val">'+(last?last+'kg':'—')+'</div><div class="summary-lbl">Último</div></div>'+
      '<div class="summary-card"><div class="summary-val">'+(high?high+'kg':'—')+'</div><div class="summary-lbl">Máximo</div></div>'+
      '<div class="summary-card"><div class="summary-val">'+(low?low+'kg':'—')+'</div><div class="summary-lbl">Mínimo</div></div>'+
    '</div>';
    const insight=validData.length<2?'Necesitas más registros para ver una tendencia.':parseFloat(variation)>0.5?'Tu peso ha subido '+variation+' kg esta semana.':parseFloat(variation)<-0.5?'Tu peso ha bajado '+Math.abs(variation)+' kg esta semana.':'Tu peso se ha mantenido estable esta semana.';
    summaryHtml+='<div class="insight-block"><div class="insight-title">Datos importantes</div><div class="insight-text">'+insight+(variation!==null?' Variación: '+(parseFloat(variation)>0?'+':'')+variation+' kg.':'')+'</div></div>';
  }

  return periods+tooltip+chartHtml+summaryHtml;
}

function renderActivityModal(){
  const wk=weekKey(),wd=gymData[wk]||{};
  const activities=DAYS.map((d,i)=>{const dd=wd[i]||{};return{dia:d,val:dd.entreno||null};});
  const withActivity=activities.filter(a=>a.val);
  const counts={};withActivity.forEach(a=>{counts[a.val]=(counts[a.val]||0)+1;});
  const mostCommon=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  const periods='<div class="period-selector">'+['D','S','M','6M','A'].map(p=>'<div class="period-btn'+(p==='S'?' active':'')+'" onclick="void(0)">'+p+'</div>').join('')+'</div>';
  const list='<div style="background:var(--bg3);border-radius:14px;padding:14px;margin-bottom:14px">'+
    activities.map(a=>'<div class="activity-row"><span class="activity-day">'+a.dia.substring(0,3)+'</span>'+(a.val?'<span class="activity-val">'+a.val+'</span>':'<span class="activity-empty">Sin actividad</span>')+'</div>').join('')+
  '</div>';
  const summary='<div class="summary-grid" style="margin-bottom:14px">'+
    '<div class="summary-card"><div class="summary-val">'+withActivity.length+'</div><div class="summary-lbl">Días activos</div></div>'+
    '<div class="summary-card"><div class="summary-val">'+(mostCommon?mostCommon[0]:'—')+'</div><div class="summary-lbl">Más repetida</div></div>'+
  '</div>';
  const insight=!withActivity.length?'No has registrado actividad extra esta semana.':withActivity.length<=2?'Has añadido algo de actividad extra esta semana.':'Buena semana de actividad fuera del gym.'+(mostCommon&&mostCommon[1]>1?' La actividad más repetida ha sido '+mostCommon[0]+'.':'');
  return periods+list+summary+'<div class="insight-block"><div class="insight-title">Datos importantes</div><div class="insight-text">'+insight+'</div></div>';
}
